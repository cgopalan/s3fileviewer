{{define "partials/results.html"}}
{{if .Rows}}
<p class="results-meta">{{.RowCount}} row(s){{if .Truncated}} — truncated at {{.MaxRows}} rows{{end}}</p>
<div class="results-scroll">
  <table class="results-table">
    <thead>
      <tr>
        {{range .Columns}}<th>{{.}}</th>{{end}}
      </tr>
    </thead>
    <tbody>
      {{range .Rows}}
      <tr>
        {{range .}}<td>{{.}}</td>{{end}}
      </tr>
      {{end}}
    </tbody>
  </table>
</div>
{{else}}
<p class="muted">Query returned no rows.</p>
{{end}}
{{end}}
